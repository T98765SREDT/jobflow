name: Deploy JobFlow browser demo

on:
  push:
    branches: [main]
    paths:
      - "static/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  verify:
    name: Verify browser demo before deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run repository verification
        run: |
          python -m compileall -q app.py jobflow tests
          node --check static/app.js
          node --check static/demo-data.js
          node --check static/csv.js
          node --test tests/*.test.mjs
          python -m unittest discover -s tests -v

  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload browser demo
        uses: actions/upload-pages-artifact@v3
        with:
          path: static
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
